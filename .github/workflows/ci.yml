name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      # Full history: BaselineProvenanceTests resolves recorded SHAs with
      # `git cat-file -e <sha>^{commit}` to catch invented or stale ones,
      # which a shallow default checkout cannot do.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install media tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Validate distribution
        run: python scripts/validate_distribution.py .
      - name: Run tests
        run: python -m unittest discover -s tests
      - name: Check whitespace
        run: git diff --check
